<article class="targeta-recepta" [class.oberta]="oberta">
  <app-etiqueta-recepta [categoria]="recepta.categoria" [destacada]="recepta.destacada ?? false" />

  <h2>{{ recepta.titol }}</h2>

  <p>{{ recepta.descripcio }}</p>

  <p>
    <strong>Valoració:</strong>
    ★ {{ recepta.valoracio }} / 5
  </p>

  <p>
    <strong>Actualitzada:</strong>
    {{ recepta.dataActualitzacio | date: 'dd/MM/yyyy' }}
  </p>

  <button type="button" [attr.aria-expanded]="oberta" (click)="seleccionarRecepta()">
    {{ oberta ? 'Amagar detall' : 'Veure detall' }}
  </button>

  @if (oberta) {
    <div class="detall-desplegat">
      <p><strong>Categoria:</strong> {{ recepta.categoria }}</p>
      <p><strong>Valoració:</strong> {{ recepta.valoracio }} / 5</p>
      <p>{{ recepta.descripcio }}</p>
    </div>
  }
</article>
