<a class="salt-contingut" href="#contingut-principal"> Salta al contingut principal </a>

<header class="capcalera">
  <h1>Receptes de la iaia</h1>
  <p>Descobreix les receptes tradicionals de casa nostra.</p>
</header>

<main class="contenidor" id="contingut-principal">
  <app-barra-filtres (filtresCanviats)="aplicarFiltres($event)" />

  <section class="resultats">
    <h2>Les nostres receptes</h2>

    <p aria-live="polite" aria-atomic="true">Receptes trobades: {{ receptesFiltrades.length }}</p>

    <app-llista-receptes
      [receptes]="receptesFiltrades"
      [receptaSeleccionada]="receptaSeleccionada"
      (seleccionada)="seleccionarRecepta($event)"
    />
  </section>
</main>

<router-outlet />
